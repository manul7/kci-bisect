version: 1

phases:
  - phase: 1
    goal: "Select the runtime and dev toolchain all later tasks use"
    tasks:
      design-and-docs/select-imp-env.md:
        stream: "Design&Docs"
        title: "Select the dev env"
        priority: high
        delivers: "Approved runtime and dev toolchain in `docs/imp-env.md`"
        depends_on: []

  - phase: 2
    goal: "Define the unit-test CR fields and the two service APIs so service implementation can start"
    tasks:
      design-and-docs/define-unit-test-cr-fields.md:
        stream: "Design&Docs"
        title: "Define unit-test CR fields"
        priority: high
        delivers: "Defined unit-test scope in CRs"
        depends_on: []
      design-and-docs/define-bco-oapi-spec.md:
        stream: "Design&Docs"
        title: "Define BCO OpenAPI spec"
        priority: high
        delivers: "OpenAPI operations for CR submission and campaign reads"
        depends_on:
          - design-and-docs/define-unit-test-cr-fields.md
      design-and-docs/define-bto-oapi-spec.md:
        stream: "Design&Docs"
        title: "Define BTO OpenAPI spec"
        priority: high
        delivers: "OpenAPI operation for build-test plan submission"
        depends_on: []

  - phase: 3
    goal: "Build BCO and BTO REST services that accept one CR and one build-test plan"
    tasks:
      bco/create-the-bco-service-and-store.md:
        stream: "BCO"
        title: "Create the BCO service, store, and REST API"
        priority: high
        delivers: "BCO REST service bootstrap, isolated store initialization, and startup/isolation tests"
        depends_on:
          - design-and-docs/define-bco-oapi-spec.md
          - design-and-docs/select-imp-env.md
      bto/create-bto-svc-and-store.md:
        stream: "BTO"
        title: "Create the BTO service, store, and REST API"
        priority: high
        delivers: "BTO REST service bootstrap, isolated store initialization, and startup/isolation tests"
        depends_on:
          - design-and-docs/define-bto-oapi-spec.md
          - design-and-docs/select-imp-env.md
      bco/accept-cr.md:
        stream: "BCO"
        title: "Accept a CR"
        priority: high
        delivers: "A stored campaign and `campaign_ref` from the BCO REST API"
        depends_on:
          - bco/create-the-bco-service-and-store.md
      bto/accept-build-test-plan.md:
        stream: "BTO"
        title: "Accept build-test plan"
        priority: high
        delivers: "A stored BTO plan and plan-submission acknowledgement"
        depends_on:
          - bto/create-bto-svc-and-store.md

  - phase: 4
    goal: "Connect BCO to BTO"
    tasks:
      bco/connect-to-bto-plan-submission.md:
        stream: "BCO"
        title: "Connect BCO to BTO plan submission"
        priority: high
        delivers: "BCO plan submission through the BTO REST API"
        depends_on:
          - bco/accept-cr.md
          - bto/accept-build-test-plan.md

  - phase: 5
    goal: "Define the execution inputs and build the boundaries and stored state the first round needs"
    tasks:
      design-and-docs/select-first-execution-backend.md:
        stream: "Design&Docs"
        title: "Select the first execution backend"
        priority: high
        delivers: "A selected first build-test backend with its composition, settings, and outcome map"
        depends_on: []
      design-and-docs/define-bto-result-lookup-behavior.md:
        stream: "Design&Docs"
        title: "Define BTO result lookup behavior"
        priority: high
        delivers: "Defined BTO lookup responses and BCO handling"
        depends_on:
          - design-and-docs/define-bto-oapi-spec.md
      design-and-docs/select-unit-test-result-input.md:
        stream: "Design&Docs"
        title: "Select unit-test result input"
        priority: high
        delivers: "Defined BTO output used for unit-test observation"
        depends_on:
          - design-and-docs/define-unit-test-cr-fields.md
      design-and-docs/define-evidence-storage.md:
        stream: "Design&Docs"
        title: "Define evidence storage"
        priority: high
        delivers: "Defined owner and shape of stored decision evidence"
        depends_on: []
      design-and-docs/document-source-repository-scope.md:
        stream: "Design&Docs"
        title: "Document the source-repository scope"
        priority: medium
        delivers: "A recorded public-repository scope statement in the architecture"
        depends_on: []
      bco/persist-campaign-lifecycle-and-membership.md:
        stream: "BCO"
        title: "Persist campaign lifecycle and membership"
        priority: high
        delivers: "Stored CRs, campaign lifecycle state, and trigger membership"
        depends_on:
          - bco/accept-cr.md
      bto/load-execution-compositions.md:
        stream: "BTO"
        title: "Load execution compositions"
        priority: high
        delivers: "Configured planner, builder, and tester roles for a composition"
        depends_on:
          - bto/create-bto-svc-and-store.md
      commit-selector/build-the-commit-selector-boundary.md:
        stream: "Commit selector"
        title: "Build the Commit selector boundary"
        priority: high
        delivers: "A stateless Commit selector service boundary for BCO"
        depends_on:
          - design-and-docs/select-imp-env.md
      results-analyzer/implement-the-results-analyzer-contract.md:
        stream: "Results Analyzer"
        title: "Implement the Results Analyzer contract"
        priority: high
        delivers: "A backend-independent boundary from plan output to decision evidence"
        depends_on:
          - design-and-docs/select-imp-env.md
      execution-adapters/translate-plan-requests-for-the-execution-backend.md:
        stream: "Execution adapters"
        title: "Translate plan requests for the execution backend"
        priority: high
        delivers: "Backend-specific execution requests without leaking backend syntax"
        depends_on:
          - bto/accept-build-test-plan.md
          - design-and-docs/select-first-execution-backend.md

  - phase: 6
    goal: "Produce and store the inputs a bisection step needs"
    tasks:
      bco/persist-steps-and-attempts.md:
        stream: "BCO"
        title: "Persist steps and attempts"
        priority: high
        delivers: "Stored candidate, attempt, and plan records"
        depends_on:
          - bco/persist-campaign-lifecycle-and-membership.md
      commit-selector/prepare-source-history-for-selection.md:
        stream: "Commit selector"
        title: "Prepare source history for selection"
        priority: high
        delivers: "A valid, current source-history view for commit selection"
        depends_on:
          - commit-selector/build-the-commit-selector-boundary.md
          - design-and-docs/document-source-repository-scope.md
      results-analyzer/produce-unit-test-observations.md:
        stream: "Results Analyzer"
        title: "Produce unit-test observations"
        priority: high
        delivers: "Structured evidence of the expected unit-test failure signature"
        depends_on:
          - design-and-docs/select-unit-test-result-input.md
          - results-analyzer/implement-the-results-analyzer-contract.md
      results-analyzer/produce-unit-test-qualification-observations.md:
        stream: "Results Analyzer"
        title: "Produce unit-test qualification observations"
        priority: high
        delivers: "Structured evidence of whether the requested test ran successfully"
        depends_on:
          - design-and-docs/select-unit-test-result-input.md
          - results-analyzer/implement-the-results-analyzer-contract.md
      decision-engine/implement-unit-test-qualification-check.md:
        stream: "Decision engine"
        title: "Implement the unit-test qualification check"
        priority: high
        delivers: "Exclusion of unit-test results that cannot prove the expected regression"
        depends_on:
          - results-analyzer/produce-unit-test-qualification-observations.md
      execution-adapters/run-combined-build-and-test-execution.md:
        stream: "Execution adapters"
        title: "Run combined build and test execution"
        priority: high
        delivers: "Combined backend build and test execution"
        depends_on:
          - execution-adapters/translate-plan-requests-for-the-execution-backend.md

  - phase: 7
    goal: "Complete each component's contract result and run the components together in the test harness"
    tasks:
      bco/persist-evidence-decisions-and-final-records.md:
        stream: "BCO"
        title: "Persist evidence, decisions, and final records"
        priority: high
        delivers: "Stored evidence, decisions, and terminal campaign records"
        depends_on:
          - bco/persist-steps-and-attempts.md
          - design-and-docs/define-evidence-storage.md
      commit-selector/implement-standard-bisect.md:
        stream: "Commit selector"
        title: "Implement standard bisect"
        priority: high
        delivers: "Deterministic candidate selection and terminal bisect results"
        depends_on:
          - commit-selector/prepare-source-history-for-selection.md
      decision-engine/implement-unit-test-decisions.md:
        stream: "Decision engine"
        title: "Implement unit-test decisions"
        priority: high
        delivers: "Binary unit-test decisions for BCO and Commit selector"
        depends_on:
          - decision-engine/implement-unit-test-qualification-check.md
          - results-analyzer/produce-unit-test-observations.md
      execution-adapters/map-backend-results-to-plan-outcomes.md:
        stream: "Execution adapters"
        title: "Map backend results to plan outcomes"
        priority: high
        delivers: "Backend-independent BTO plan outcomes for BCO"
        depends_on:
          - execution-adapters/run-combined-build-and-test-execution.md
      e2e/create-the-component-test-harness.md:
        stream: "E2E"
        title: "Create the component test harness"
        priority: high
        delivers: "Repeatable component integration tests with controlled dependencies"
        depends_on:
          - bco/create-the-bco-service-and-store.md
          - bto/create-bto-svc-and-store.md
          - commit-selector/build-the-commit-selector-boundary.md
          - decision-engine/implement-unit-test-qualification-check.md

  - phase: 8
    goal: "Store a selected candidate and run one BTO plan to a final result"
    tasks:
      bco/store-and-apply-commit-selector-results.md:
        stream: "BCO"
        title: "Store and apply Commit selector results"
        priority: high
        delivers: "Stored selection and application of the next candidate"
        depends_on:
          - bco/persist-steps-and-attempts.md
          - commit-selector/implement-standard-bisect.md
      bto/execute-one-plan.md:
        stream: "BTO"
        title: "Execute one plan"
        priority: high
        delivers: "Backend execution and a final result for one BTO plan"
        depends_on:
          - bto/accept-build-test-plan.md
          - bto/load-execution-compositions.md
          - execution-adapters/map-backend-results-to-plan-outcomes.md

  - phase: 9
    goal: "Complete one BCO-BTO plan round trip"
    tasks:
      bco/submit-one-bto-plan-per-attempt.md:
        stream: "BCO"
        title: "Submit one BTO plan per attempt"
        priority: high
        delivers: "One BTO plan submission for each step attempt"
        depends_on:
          - bco/connect-to-bto-plan-submission.md
          - bco/store-and-apply-commit-selector-results.md
          - design-and-docs/select-unit-test-result-input.md
      bto/keep-completed-plan-results-available-to-bco.md:
        stream: "BTO"
        title: "Keep completed plan results available to BCO"
        priority: high
        delivers: "Final BTO plan results available for lookup by BCO"
        depends_on:
          - bto/execute-one-plan.md
          - design-and-docs/define-bto-result-lookup-behavior.md
      bco/read-bto-plan-results.md:
        stream: "BCO"
        title: "Read BTO plan results"
        priority: high
        delivers: "One BTO plan result stored against its step attempt"
        depends_on:
          - bco/submit-one-bto-plan-per-attempt.md
          - bto/keep-completed-plan-results-available-to-bco.md

  - phase: 10
    goal: "Turn one plan result into one step decision"
    tasks:
      bco/route-bto-plan-outcomes.md:
        stream: "BCO"
        title: "Route BTO plan outcomes"
        priority: high
        delivers: "Correct routing of BTO outcomes into analysis or campaign failure"
        depends_on:
          - bco/persist-evidence-decisions-and-final-records.md
          - bco/read-bto-plan-results.md
          - results-analyzer/implement-the-results-analyzer-contract.md
      bco/run-one-analysis-attempt.md:
        stream: "BCO"
        title: "Run one analysis attempt"
        priority: high
        delivers: "One evidence record bound to the step attempt that produced it"
        depends_on:
          - bco/route-bto-plan-outcomes.md
          - results-analyzer/produce-unit-test-observations.md
          - results-analyzer/produce-unit-test-qualification-observations.md
      bco/request-one-step-decision.md:
        stream: "BCO"
        title: "Request one step decision"
        priority: high
        delivers: "One durable decision per analyzed campaign step"
        depends_on:
          - bco/run-one-analysis-attempt.md
          - decision-engine/implement-unit-test-decisions.md

  - phase: 11
    goal: "Drive the campaign to its conclusion and expose its status"
    tasks:
      bco/apply-decisions-and-finish-the-campaign.md:
        stream: "BCO"
        title: "Apply decisions and finish the campaign"
        priority: high
        delivers: "Campaign boundary updates and terminal conclusions from stored decisions"
        depends_on:
          - bco/request-one-step-decision.md
      bco/drive-the-campaign-loop.md:
        stream: "BCO"
        title: "Drive the campaign loop"
        priority: high
        delivers: "One BCO loop that takes an accepted campaign to its recorded conclusion"
        depends_on:
          - bco/apply-decisions-and-finish-the-campaign.md
      bco/expose-campaign-status.md:
        stream: "BCO"
        title: "Expose campaign status"
        priority: high
        delivers: "Campaign progress and final BCO output through the REST API"
        depends_on:
          - bco/persist-evidence-decisions-and-final-records.md

  - phase: 12
    goal: "Prove the minimal unit-test path E2E"
    tasks:
      e2e/test-the-unit-test-campaign-path.md:
        stream: "E2E"
        title: "Test the unit-test campaign path"
        priority: high
        delivers: "Proof that the unit-test path reaches a culprit E2E"
        depends_on:
          - bco/drive-the-campaign-loop.md
          - bco/expose-campaign-status.md
          - e2e/create-the-component-test-harness.md

  - phase: 13
    goal: "Check the listed MVP contract rules for the unit-test path"
    tasks:
      contracts/check-minimal-cr-admission-rules.md:
        stream: "Contracts"
        title: "Check minimal CR admission rules"
        priority: high
        delivers: "Listed unit-test CR errors are returned without creating campaign or step data"
        depends_on:
          - bco/accept-cr.md
      contracts/check-mvp-bco-output-rules.md:
        stream: "Contracts"
        title: "Check MVP BCO output rules"
        priority: high
        delivers: "BCO responses for the listed campaign states contain the listed fields, timestamps, step order, and outcomes"
        depends_on:
          - bco/apply-decisions-and-finish-the-campaign.md
          - bco/expose-campaign-status.md
      contracts/check-mvp-bto-request-and-result-rules.md:
        stream: "Contracts"
        title: "Check MVP BTO request and result rules"
        priority: high
        delivers: "BTO rejects the listed request errors and returns the listed acknowledgement, lookup, and result fields"
        depends_on:
          - bto/keep-completed-plan-results-available-to-bco.md
      contracts/check-plain-bisect-request-and-result-rules.md:
        stream: "Contracts"
        title: "Check plain-bisect request and result rules"
        priority: high
        delivers: "Plain bisect rejects the listed bad inputs and returns the listed request IDs and result fields"
        depends_on:
          - commit-selector/implement-standard-bisect.md
      contracts/check-decision-request-and-result-rules.md:
        stream: "Contracts"
        title: "Check Decision request and result rules"
        priority: high
        delivers: "Decision requests and results use the listed fields, and BCO saves no mismatched result"
        depends_on:
          - bco/request-one-step-decision.md
      contracts/check-unit-test-analyzer-request-and-evidence-rules.md:
        stream: "Contracts"
        title: "Check unit-test analyzer request and evidence rules"
        priority: high
        delivers: "Results Analyzer rejects the listed non-content inputs and returns the listed unit-test evidence fields and IDs"
        depends_on:
          - results-analyzer/produce-unit-test-observations.md
          - results-analyzer/produce-unit-test-qualification-observations.md
      contracts/check-unit-test-decision-rules.md:
        stream: "Contracts"
        title: "Check unit-test decision rules"
        priority: high
        delivers: "Listed unit-test evidence cases return their defined `good`, `bad`, `skip`, or `weak` decision"
        depends_on:
          - decision-engine/implement-unit-test-decisions.md
          - results-analyzer/produce-unit-test-observations.md
          - results-analyzer/produce-unit-test-qualification-observations.md

  - phase: 14
    goal: "Define the admission, limit, cancellation, auth, and recovery rules, and run one MVP campaign executor"
    tasks:
      bco/run-one-bco-campaign-executor-for-the-mvp.md:
        stream: "BCO"
        title: "Run one BCO campaign executor for the MVP"
        priority: high
        delivers: "One BCO campaign executor with no overlap in the MVP deployment"
        depends_on:
          - bco/create-the-bco-service-and-store.md
      design-and-docs/define-campaign-stop-limits.md:
        stream: "Design&Docs"
        title: "Define campaign stop limits"
        priority: medium
        delivers: "Defined campaign limits and their completion outcomes"
        depends_on:
          - e2e/test-the-unit-test-campaign-path.md
      design-and-docs/define-campaign-cancellation-behavior.md:
        stream: "Design&Docs"
        title: "Define campaign cancellation behavior"
        priority: high
        delivers: "Defined cancellation behavior using the existing campaign and step statuses"
        depends_on:
          - design-and-docs/define-bco-oapi-spec.md
          - e2e/test-the-unit-test-campaign-path.md
      design-and-docs/define-how-admission-validates-toolchains.md:
        stream: "Design&Docs"
        title: "Define configurable toolchain admission"
        priority: medium
        delivers: "Defined configurable toolchain rules for campaign admission"
        depends_on:
          - bco/accept-cr.md
      design-and-docs/define-service-authentication.md:
        stream: "Design&Docs"
        title: "Define service auth"
        priority: high
        delivers: "Defined auth for Trigger, BCO, BTO, and execution calls"
        depends_on:
          - design-and-docs/define-bco-oapi-spec.md
          - design-and-docs/define-bto-oapi-spec.md
      design-and-docs/define-who-can-access-a-campaign.md:
        stream: "Design&Docs"
        title: "Define who can access a campaign"
        priority: high
        delivers: "Defined authorization for campaign reads and cancellation"
        depends_on:
          - bco/expose-campaign-status.md
      design-and-docs/define-campaign-execution-profile-source.md:
        stream: "Design&Docs"
        title: "Define the campaign execution profile source"
        priority: high
        delivers: "Defined provider, format, and loading path for the campaign execution profile"
        depends_on: []
      design-and-docs/define-backend-work-recovery.md:
        stream: "Design&Docs"
        title: "Define how BTO avoids duplicate backend work"
        priority: medium
        delivers: "Defined backend action identity and replay rule for BTO restart recovery"
        depends_on:
          - execution-adapters/run-combined-build-and-test-execution.md

  - phase: 15
    goal: "Enforce the admission, limit, cancellation, and auth rules, and make BTO plan retries safe"
    tasks:
      bco/load-the-campaign-execution-profile.md:
        stream: "BCO"
        title: "Load the campaign execution profile"
        priority: high
        delivers: "A loaded, validated campaign execution profile available to BCO admission"
        depends_on:
          - bco/create-the-bco-service-and-store.md
          - design-and-docs/define-campaign-execution-profile-source.md
      bco/validate-crs-before-creating-state.md:
        stream: "BCO"
        title: "Check requests against deployment capabilities"
        priority: high
        delivers: "Requests outside deployment capabilities are rejected before campaign creation"
        depends_on:
          - bco/build-trigger-registry-and-authentication.md
          - bco/load-the-campaign-execution-profile.md
          - contracts/check-minimal-cr-admission-rules.md
      bco/validate-toolchains-at-admission.md:
        stream: "BCO"
        title: "Use configured toolchain admission rules"
        priority: medium
        delivers: "Requests using a toolchain the deployment cannot provide are rejected before campaign creation"
        depends_on:
          - design-and-docs/define-how-admission-validates-toolchains.md
      bco/enforce-campaign-stop-limits.md:
        stream: "BCO"
        title: "Enforce campaign stop limits"
        priority: medium
        delivers: "Consistent campaign completion when a configured limit is reached"
        depends_on:
          - bco/drive-the-campaign-loop.md
          - bco/run-one-bco-campaign-executor-for-the-mvp.md
          - design-and-docs/define-campaign-stop-limits.md
      bco/implement-campaign-cancellation.md:
        stream: "BCO"
        title: "Implement campaign cancellation"
        priority: high
        delivers: "Safe cancellation that stops work and freezes campaign decisions"
        depends_on:
          - bco/drive-the-campaign-loop.md
          - bco/run-one-bco-campaign-executor-for-the-mvp.md
          - design-and-docs/define-campaign-cancellation-behavior.md
      bco/build-trigger-registry-and-authentication.md:
        stream: "BCO"
        title: "Authenticate Triggers and load execution settings"
        priority: high
        delivers: "Authenticated Trigger identity and execution settings available to campaign admission"
        depends_on:
          - bco/create-the-bco-service-and-store.md
          - design-and-docs/define-service-authentication.md
      bto/add-idempotent-plan-admission.md:
        stream: "BTO"
        title: "Reuse a BTO plan when BCO retries"
        priority: high
        delivers: "One BTO plan and one execution when BCO retries the same submission"
        depends_on:
          - bto/execute-one-plan.md
      bto/authenticate-bto-service-calls.md:
        stream: "BTO"
        title: "Authenticate BCO calls to BTO"
        priority: high
        delivers: "Only authenticated BCO callers can submit or read BTO plans"
        depends_on:
          - bco/read-bto-plan-results.md
          - design-and-docs/define-service-authentication.md
      execution-adapters/authenticate-backend-calls.md:
        stream: "Execution adapters"
        title: "Authenticate BTO calls to the execution backend"
        priority: medium
        delivers: "Backend calls carry the credentials the service-auth design defines"
        depends_on:
          - design-and-docs/define-service-authentication.md
          - execution-adapters/run-combined-build-and-test-execution.md

  - phase: 16
    goal: "Authorize campaign access, prevent duplicates, and recover after restart"
    tasks:
      bco/authorize-campaign-access.md:
        stream: "BCO"
        title: "Authorize campaign access"
        priority: medium
        delivers: "Authorized campaign reads and cancellation"
        depends_on:
          - bco/build-trigger-registry-and-authentication.md
          - bco/implement-campaign-cancellation.md
          - design-and-docs/define-who-can-access-a-campaign.md
      bco/create-or-join-equivalent-campaigns-atomically.md:
        stream: "BCO"
        title: "Create or join equivalent campaigns atomically"
        priority: high
        delivers: "One shared campaign for concurrent equivalent requests"
        depends_on:
          - bco/persist-campaign-lifecycle-and-membership.md
          - bco/validate-crs-before-creating-state.md
          - bco/validate-toolchains-at-admission.md
      bco/recover-plan-results-after-restart.md:
        stream: "BCO"
        title: "Recover plan submissions and results after restart"
        priority: medium
        delivers: "Restart-safe recovery of BTO plan submissions and results by BCO"
        depends_on:
          - bco/drive-the-campaign-loop.md
          - bto/add-idempotent-plan-admission.md
      bto/recover-plan-execution-after-restart.md:
        stream: "BTO"
        title: "Recover plan execution after restart"
        priority: medium
        delivers: "Restart-safe BTO plan execution"
        depends_on:
          - bto/add-idempotent-plan-admission.md
          - bto/execute-one-plan.md
          - design-and-docs/define-backend-work-recovery.md

  - phase: 17
    goal: "Test cancellation and BCO recovery"
    tasks:
      bco/test-bco-crash-recovery.md:
        stream: "BCO"
        title: "Test BCO crash recovery"
        priority: high
        delivers: "Evidence that BCO recovery does not duplicate campaign work"
